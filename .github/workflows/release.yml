name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Версия
        shell: pwsh
        run: |
          $v = (Select-String -Path app/paths.py -Pattern 'APP_VERSION = "(.+?)"').Matches[0].Groups[1].Value
          $iss = (Select-String -Path installer/ZapretCloud.iss -Pattern '#define AppVersion "(.+?)"').Matches[0].Groups[1].Value
          if ($v -ne $iss) { throw "APP_VERSION ($v) и AppVersion в .iss ($iss) не совпадают" }
          if ("${{ github.ref_type }}" -eq "tag" -and "v$v" -ne "${{ github.ref_name }}") { throw "Тег ${{ github.ref_name }} не совпадает с APP_VERSION $v" }
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # описание релиза — раздел «## Изменения X» из README
          $md = Get-Content README.md -Raw -Encoding utf8
          $m = [regex]::Match($md, "(?s)## Изменения $([regex]::Escape($v))\s*\n(.*?)(?=\n## |\z)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "ZapretCloud $v" }
          Set-Content -Path notes.md -Value $notes -Encoding utf8

      - name: Зависимости
        run: python -m pip install -r requirements.txt pyinstaller

      - name: PyInstaller
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --uac-admin --name ZapretCloud --icon assets\icon.ico --add-data "assets;assets" --exclude-module tkinter main.py

      - name: Движок
        shell: cmd
        run: |
          robocopy engine dist\ZapretCloud\engine /E /NFL /NDL /NJH /NJS /NP
          if errorlevel 8 exit /b 1
          if exist dist\ZapretCloud\engine\lists\zc_custom rmdir /s /q dist\ZapretCloud\engine\lists\zc_custom
          exit /b 0

      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Q installer\ZapretCloud.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC завершился с ошибкой $LASTEXITCODE" }

      - name: Релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: ZapretCloud ${{ env.APP_VERSION }}
          body_path: notes.md
          files: installer/Output/ZapretCloud_Setup_${{ env.APP_VERSION }}.exe
